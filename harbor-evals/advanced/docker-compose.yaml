# Example volume-mount oriented compose for Harbor-style sandboxes.
#
# Harbor often builds from environment/Dockerfile alone. Use compose when you
# need sidecars or host mounts (large fixtures, read-only skill trees, secrets
# injected at runtime - never commit secret values).
#
# Comments only - adapt service names to match your Harbor / local workflow.
# When Harbor uses compose, the agent typically runs in the `main` service.
#
# Mount the skill, not the answer sheet: bind only the skill directory (or
# COPY that subtree into the image). Do not mount a whole samples/task repo
# that also holds fixtures/, tests/, or expected intent strings where the
# agent can read them. For agent-native injection at run time, prefer
# `harbor run --skill <skill-dir>` (repeatable) instead of a broad mount.

services:
  main:
    build:
      context: ./base-image
      dockerfile: Dockerfile
    working_dir: /app
    # Host mounts: bind large or private trees without baking them into the image.
    volumes:
      # Agent / verifier log dirs Harbor expects
      - agent-logs:/logs/agent
      - verifier-logs:/logs/verifier
      # Example: mount a local skill checkout read-only into the sandbox
      # (skill dir only - not the harbor-evals task tree beside it)
      # - ../../team-brain-intro/.cursor/skills/team-brain-intro:/opt/skills/team-brain-intro:ro
      # Example: host fixtures for verifier-side iteration - keep these off
      # paths the agent can list/open during the trial
      # - ./sibling-task-a/fixtures:/app/fixtures:ro
    environment:
      # Pass through keys from the host env at run time - do not hard-code values.
      # OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CODESLOTH_HARBOR_BASE: "1"
    stdin_open: true
    tty: true

  # Optional sidecar (database, mock API, etc.)
  # fixtures-sidecar:
  #   image: nginx:alpine
  #   volumes:
  #     - ./sibling-task-a/fixtures:/usr/share/nginx/html:ro

volumes:
  agent-logs:
  verifier-logs:
